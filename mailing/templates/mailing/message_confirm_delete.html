{% extends 'mailing/base.html' %}

{% block title %}Удаление сообщения{% endblock %}

{% block content %}
<h1>Удалить сообщение?</h1>

<p><strong>{{ message.subject }}</strong></p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'message_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
