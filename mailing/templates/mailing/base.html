<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Mailing Service{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="container mt-4">

    <nav class="mb-4">
        <a href="{% url 'home' %}" class="btn btn-dark">Главная</a>

        {% if user.is_authenticated %}

        {% if is_manager %}
        <a href="{% url 'recipient_list' %}" class="btn btn-dark">Клиенты</a>
        <a href="{% url 'message_list' %}" class="btn btn-dark">Сообщения</a>
        <a href="{% url 'mailing_list' %}" class="btn btn-dark">Рассылки</a>
        <a href="{% url 'stats' %}" class="btn btn-dark">Статистика</a>
        {% endif %}



        <a href="{% url 'logout' %}" class="btn btn-outline-danger me-3">Выход</a>

        {% else %}
        <a href="{% url 'login' %}" class="btn btn-primary">Вход</a>
        <a href="{% url 'register' %}" class="btn btn-success">Регистрация</a>
        {% endif %}

    </nav>

    {% block content %}
    {% endblock %}

</body>

</html>
