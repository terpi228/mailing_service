{% extends 'mailing/base.html' %}

{% block title %}Восстановление пароля{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h2 class="card-title text-center">Забыли пароль?</h2>
                <p class="text-muted text-center">Введите ваш email, и мы отправим ссылку для сброса.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_email" class="form-label">Email</label>
                        <input type="email" class="form-control" name="email" id="id_email" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Отправить</button>
                </form>
                <hr>
                <p class="text-center"><a href="{% url 'login' %}">Вернуться ко входу</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
