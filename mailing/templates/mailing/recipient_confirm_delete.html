{% extends 'mailing/base.html' %}

{% block title %}Удаление клиента{% endblock %}

{% block content %}
<h1>Удалить клиента?</h1>

<p>{{ recipient.email }} — {{ recipient.full_name }}</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'recipient_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
