{% extends 'mailing/base.html' %}

{% block title %}Письмо отправлено{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="alert alert-success" role="alert">
            <h4 class="alert-heading">Проверьте почту!</h4>
            <p>Мы отправили вам инструкции по восстановлению пароля. Если письмо не пришло, проверьте папку «Спам».</p>
            <hr>
            <p class="mb-0"><a href="{% url 'login' %}">Вернуться ко входу</a></p>
        </div>
    </div>
</div>
{% endblock %}
